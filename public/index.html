<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Cloud</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"></head>
<body><main class="auth"><div class="card">
  <div class="brand"><span class="logo">FC</span>File Cloud</div>
  <p class="muted">Tus archivos, en tu propio servidor.</p>
  <div class="tabs"><button class="tab on" data-m="login">Iniciar sesión</button><button class="tab" data-m="register" id="regTab">Registrarse</button></div>
  <form id="f"><label>Usuario<input class="input" id="u" autocomplete="username" required></label>
  <label>Contraseña<input class="input" id="p" type="password" autocomplete="current-password" required minlength="1"></label>
  <div class="err" id="e"></div><button class="btn" style="width:100%" id="go">Entrar</button></form>
</div></main><script src="/js/common.js"></script><script src="/js/auth.js"></script></body></html>
